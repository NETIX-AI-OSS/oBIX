name: UV dependency snapshot

on:
  push:
    branches: [master]
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One stable stream across every trigger. Never cancel an in-flight API submission.
concurrency:
  group: netix-uv-lock-default
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: build-only
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish exact default-branch UV dependencies
        uses: NETIX-AI-OSS/.github/actions/uv-dependency-submission@6a30d27e7b984cec2d22edd245bcffbee5d1fec0
        with:
          submit: 'true'
      - name: Keep snapshot and publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uv-dependency-snapshot
          path: |
            ${{ runner.temp }}/netix-uv-dependency-snapshot.json
            ${{ runner.temp }}/netix-uv-dependency-receipt.json
          if-no-files-found: ignore
          retention-days: 7
